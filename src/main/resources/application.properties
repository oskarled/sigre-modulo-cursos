# ============================================================
# SIGRE - API REST (perfil por defecto: MySQL)
# Para usar la base en memoria H2 ejecute con el perfil dev:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================
spring.application.name=sigre-modulo-cursos
server.port=${PORT:8080}

# --- MySQL 8 (los valores se pueden cambiar con variables de entorno) ---
spring.datasource.url=${SIGRE_DB_URL:jdbc:mysql://localhost:3306/sigre_db?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SIGRE_DB_USER:root}
spring.datasource.password=${SIGRE_DB_PASSWORD:}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Fechas en formato ISO (AAAA-MM-DDTHH:mm:ss) y zona horaria de Colombia
spring.jackson.time-zone=America/Bogota

# Origenes permitidos para el frontend (separados por comas)
sigre.cors.origenes=${SIGRE_CORS_ORIGENES:http://localhost:5173,http://localhost:4173}

# Documentacion: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
