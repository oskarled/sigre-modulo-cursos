# ---------------------------------------------------------------------
# SIGRE - Modulo de cursos e inscripciones
# Configuracion principal (base de datos MySQL)
# Los valores pueden cambiarse con variables de entorno:
# DB_URL, DB_USER, DB_PASSWORD y SIGRE_DATOS_DEMO
# ---------------------------------------------------------------------
spring.application.name=sigre-modulo-cursos
server.port=8080

# Conexion a MySQL 8 (se crea la base de datos sigre_db si no existe)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigre_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate: crea o ajusta las tablas segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datos de demostracion (un admin, un instructor y dos asistentes). Desactivado por defecto.
sigre.datos-demo=${SIGRE_DATOS_DEMO:false}
