# ============================================================
# Perfil dev: base de datos en memoria H2 (no requiere instalar MySQL).
# Los datos se borran al detener la aplicacion y se recargan al iniciar.
# Consola H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:sigre, usuario: sa)
# ============================================================
spring.datasource.url=jdbc:h2:mem:sigre;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
