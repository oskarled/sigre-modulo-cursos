# ---------------------------------------------------------------------
# Perfil "dev": base de datos H2 en memoria (no requiere instalar MySQL)
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:sigre_dev;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Datos de demostracion activados en desarrollo
sigre.datos-demo=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
